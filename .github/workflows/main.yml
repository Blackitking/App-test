name: Build Driving Theory APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create Android Project
        shell: bash
        run: |

          mkdir -p app/src/main/java/com/xoshnaw/drivingtest
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/drawable-v26
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "DrivingTheoryApp"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.xoshnaw.drivingtest'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.xoshnaw.drivingtest'
                  minSdk 23
                  targetSdk 35
                  versionCode 3
                  versionName '3.0'
              }
          }
          EOF

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="icon_background">#0757C9</color>
          </resources>
          EOF

          # ئایکۆنی کۆن بۆ Android ـی کۆن
          cat > app/src/main/res/drawable/app_icon.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">

              <path
                  android:fillColor="#0757C9"
                  android:pathData="M0,0 L108,0 L108,108 L0,108 Z"/>

              <circle
                  android:fillColor="#FFFFFF"
                  android:strokeColor="#00D9FF"
                  android:strokeWidth="5"
                  android:cx="54"
                  android:cy="54"
                  android:radius="29"/>

              <circle
                  android:fillColor="#0757C9"
                  android:cx="54"
                  android:cy="54"
                  android:radius="20"/>

              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M54,31 L58,48 L75,54 L58,60 L54,77 L50,60 L33,54 L50,48 Z"/>

              <path
                  android:fillColor="#00D9FF"
                  android:pathData="M54,38 L57,51 L70,54 L57,57 L54,70 L51,57 L38,54 L51,51 Z"/>

          </vector>
          EOF

          # پێشەوەی Adaptive Icon
          cat > app/src/main/res/drawable/app_icon_foreground.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">

              <circle
                  android:fillColor="#FFFFFF"
                  android:cx="54"
                  android:cy="54"
                  android:radius="29"/>

              <circle
                  android:fillColor="#0757C9"
                  android:cx="54"
                  android:cy="54"
                  android:radius="20"/>

              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M54,31 L58,48 L75,54 L58,60 L54,77 L50,60 L33,54 L50,48 Z"/>

              <path
                  android:fillColor="#00D9FF"
                  android:pathData="M54,38 L57,51 L70,54 L57,57 L54,70 L51,57 L38,54 L51,51 Z"/>

          </vector>
          EOF

          # Adaptive Icon بۆ Android 8+
          cat > app/src/main/res/drawable-v26/app_icon.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/icon_background"/>
              <foreground android:drawable="@drawable/app_icon_foreground"/>
          </adaptive-icon>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>

              <application
                  android:allowBackup="true"
                  android:label="تاقی کردنەوەی تیۆری مۆڵەتی شوفێری"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:usesCleartextTraffic="true"
                  android:icon="@drawable/app_icon"
                  android:roundIcon="@drawable/app_icon">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/xoshnaw/drivingtest/MainActivity.java <<'EOF'
          package com.xoshnaw.drivingtest;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);

                  webView.setWebViewClient(new WebViewClient());

                  webView.loadUrl(
                      "https://blackitking.github.io/driving_test/"
                  );
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.9

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug

      - name: Check APK
        run: |
          ls -lah app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Driving-Theory-APK-v3
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
