name: Build Driving Theory APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Download project
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create Android folders
        run: |
          mkdir -p app/src/main/java/com/xoshnaw/drivingtest
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/values

      - name: Create settings.gradle
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "DrivingTheoryApp"
          include(":app")
          EOF

      - name: Create root build.gradle
        run: |
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

      - name: Create gradle.properties
        run: |
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

      - name: Create app build.gradle
        run: |
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.xoshnaw.drivingtest'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.xoshnaw.drivingtest'
                  minSdk 23
                  targetSdk 35
                  versionCode 10
                  versionName '1.0'
              }
          }
          EOF

      - name: Create icon colors
        run: |
          cat > app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="icon_blue">#0757C9</color>
          </resources>
          EOF

      - name: Create normal app icon
        run: |
          cat > app/src/main/res/drawable/app_icon.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">

              <path
                  android:fillColor="#0757C9"
                  android:pathData="M0,0 L108,0 L108,108 L0,108 Z"/>

              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M22,64 L28,45 C29,41 32,38 37,38 L71,38 C76,38 79,41 80,45 L86,64 L86,76 C86,79 84,81 81,81 L75,81 C72,81 70,79 70,76 L70,73 L38,73 L38,76 C38,79 36,81 33,81 L27,81 C24,81 22,79 22,76 Z"/>

              <path
                  android:fillColor="#0757C9"
                  android:pathData="M32,47 L76,47 L80,59 L28,59 Z"/>

              <path
                  android:fillColor="#0757C9"
                  android:pathData="M28,64 L37,64 L37,70 L28,70 Z"/>

              <path
                  android:fillColor="#0757C9"
                  android:pathData="M71,64 L80,64 L80,70 L71,70 Z"/>

              <path
                  android:fillColor="#00D9FF"
                  android:pathData="M43,64 L65,64 L65,70 L43,70 Z"/>

          </vector>
          EOF

      - name: Create adaptive icon
        run: |
          cat > app/src/main/res/drawable/app_icon_foreground.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">

              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M22,64 L28,45 C29,41 32,38 37,38 L71,38 C76,38 79,41 80,45 L86,64 L86,76 C86,79 84,81 81,81 L75,81 C72,81 70,79 70,76 L70,73 L38,73 L38,76 C38,79 36,81 33,81 L27,81 C24,81 22,79 22,76 Z"/>

              <path
                  android:fillColor="#0757C9"
                  android:pathData="M32,47 L76,47 L80,59 L28,59 Z"/>

              <path
                  android:fillColor="#00D9FF"
                  android:pathData="M43,64 L65,64 L65,70 L43,70 Z"/>

          </vector>
          EOF

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/icon_blue"/>
              <foreground android:drawable="@drawable/app_icon_foreground"/>
          </adaptive-icon>
          EOF

      - name: Create AndroidManifest
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>

              <application
                  android:allowBackup="true"
                  android:label="تاقی کردنەوەی تیۆری مۆڵەتی شوفێری"
                  android:icon="@drawable/app_icon"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

      - name: Create MainActivity
        run: |
          cat > app/src/main/java/com/xoshnaw/drivingtest/MainActivity.java <<'EOF'
          package com.xoshnaw.drivingtest;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);

                  webView.setWebViewClient(new WebViewClient());

                  webView.loadUrl(
                      "https://blackitking.github.io/driving_test/"
                  );
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          gradle clean assembleDebug --no-daemon

      - name: Verify APK
        run: |
          echo "Checking APK..."
          ls -lah app/build/outputs/apk/debug/
          test -s app/build/outputs/apk/debug/app-debug.apk
          echo "APK FOUND SUCCESSFULLY!"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Driving-Theory-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
