<!DOCTYPE html>
<html lang="ku">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>گەڕانی ناوەکان</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #222;
}

.container {
    max-width: 600px;
    margin: auto;
    padding: 25px 15px;
}

h1 {
    text-align: center;
    margin-bottom: 25px;
}

.search-box {
    display: flex;
    gap: 8px;
}

input {
    flex: 1;
    padding: 14px;
    border: 1px solid #ccc;
    border-radius: 10px;
    font-size: 16px;
}

button {
    padding: 12px 18px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    background: #2563eb;
    color: white;
    font-size: 15px;
}

button:hover {
    opacity: .9;
}

#results {
    margin-top: 20px;
}

.person {
    background: white;
    padding: 15px;
    margin-bottom: 10px;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.empty {
    text-align: center;
    color: #777;
    margin-top: 30px;
}

.admin-button {
    display: block;
    margin: 30px auto 0;
    background: #333;
}

.admin {
    display: none;
    margin-top: 30px;
    background: white;
    padding: 20px;
    border-radius: 12px;
}

.admin h2 {
    margin-top: 0;
}

.admin-list {
    margin-top: 20px;
}

.admin-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 10px;
    border-bottom: 1px solid #ddd;
}

.delete {
    background: #dc2626;
}

.logout {
    background: #555;
}
</style>
</head>

<body>

<div class="container">

    <h1>گەڕانی ناوەکان</h1>

    <div class="search-box">
        <input
            type="text"
            id="searchInput"
            placeholder="ناو بنووسە..."
            onkeydown="if(event.key==='Enter') searchNames()"
        >

        <button onclick="searchNames()">گەڕان</button>
    </div>

    <div id="results" class="empty">
        بۆ پیشاندانی ناو، گەڕان بکە.
    </div>

    <button class="admin-button" onclick="openAdmin()">
        Admin Panel
    </button>

    <div id="adminPanel" class="admin">

        <h2>Admin Panel</h2>

        <input
            type="text"
            id="newName"
            placeholder="تەواوی داتای کەسەکە"
        >

        <br><br>

        <button onclick="addName()">زیادکردن</button>

        <button class="logout" onclick="logout()">
            دەرچوون
        </button>

        <div id="adminList" class="admin-list"></div>

    </div>

</div>

<script>

/* ناوە سەرەتاییەکان */
let names = JSON.parse(localStorage.getItem("names")) || [
    "ئەوین محمد امین",
    "اسماعیل محمد",
    "ژوان ستار محمد",
    "احمد عولا ابراهیم",
    "احمد عولا احمد",
    "احمد جمیل بریندار",
    "احمد جمیل حسین",
    "اسماعیل رسول",
    "اسماعیل رسول ئەحمەد",
    "حسن علی",
    "حسن علی احمد",
    "حسن علی احمد",
    "حسن علی احمد",
    "حسن علی احمد",
    "حسن علی احمد",
    "حسن علی احمد",
    "حسن علی اسماعیل",
    "حسن علی بابیر",
    "حسن علی تمر",
    "حسن علی جمو"
];


/* هەڵگرتنی ناوەکان */
function saveNames() {
    localStorage.setItem("names", JSON.stringify(names));
}


/* گەڕانی ناوەکان */
function searchNames() {

    const input = document
        .getElementById("searchInput")
        .value
        .trim()
        .toLowerCase();

    const results = document.getElementById("results");

    /* ئەگەر هیچ شتێک نەنووسرابێت */
    if (!input) {

        results.innerHTML =
            '<div class="empty">بۆ پیشاندانی ناو، گەڕان بکە.</div>';

        return;
    }

    /* دابەشکردنی وشەکانی ناو */
    const words = input.split(/\s+/);

    const found = names.filter(name => {

        const lowerName = name.toLowerCase();

        return words.every(word =>
            lowerName.includes(word)
        );

    });


    /* ئەگەر هیچ ناوێک نەدۆزرایەوە */
    if (found.length === 0) {

        results.innerHTML =
            '<div class="empty">هیچ ناوێک نەدۆزرایەوە.</div>';

        return;
    }


    /* پیشاندانی ئەنجامەکان */
    results.innerHTML = "";

    found.forEach(name => {

        const div = document.createElement("div");

        div.className = "person";

        div.textContent = name;

        results.appendChild(div);

    });
}


/* کردنەوەی Admin Panel */
function openAdmin() {

    const code = prompt("کۆدی Admin بنووسە:");

    if (code !== "5624") {

        alert("کۆدی Admin هەڵەیە.");

        return;
    }

    document.getElementById("adminPanel").style.display = "block";

    loadAdmin();
}


/* پیشاندانی ناوەکان لە Admin */
function loadAdmin() {

    const list = document.getElementById("adminList");

    list.innerHTML = "";

    names.forEach((name, index) => {

        const div = document.createElement("div");

        div.className = "admin-item";

        div.innerHTML = `
            <span>${escapeHTML(name)}</span>

            <button
                class="delete"
                onclick="deleteName(${index})">
                سڕینەوە
            </button>
        `;

        list.appendChild(div);

    });
}


/* زیادکردنی ناو */
function addName() {

    const input = document.getElementById("newName");

    const name = input.value.trim();

    if (!name) {

        alert("تکایە ناو بنووسە.");

        return;
    }

    names.push(name);

    saveNames();

    input.value = "";

    loadAdmin();

    alert("ناوەکە زیادکرا.");
}


/* سڕینەوەی ناو */
function deleteName(index) {

    if (!confirm("دڵنیایت لە سڕینەوەی ئەم ناوە؟")) {

        return;
    }

    names.splice(index, 1);

    saveNames();

    loadAdmin();
}


/* دەرچوون لە Admin */
function logout() {

    document.getElementById("adminPanel").style.display = "none";

}


/* پاراستنی HTML */
function escapeHTML(text) {

    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}

</script>

</body>
</html>
