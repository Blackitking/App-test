<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>گەڕانی ناو</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700;800;900&display=swap');

:root{
  --bg:#070b18;
  --card:rgba(18,25,49,.78);
  --card2:rgba(23,32,62,.88);
  --line:rgba(255,255,255,.10);
  --text:#f7f8ff;
  --muted:#aeb8d4;
  --accent:#7c5cff;
  --accent2:#00d4ff;
  --danger:#ff4d6d;
  --shadow:0 24px 70px rgba(0,0,0,.38);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  min-height:100vh;
  margin:0;
  padding:28px 16px 50px;
  font-family:'Noto Sans Arabic',Arial,sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 15% 10%,rgba(124,92,255,.25),transparent 30%),
    radial-gradient(circle at 85% 20%,rgba(0,212,255,.16),transparent 28%),
    radial-gradient(circle at 50% 100%,rgba(124,92,255,.12),transparent 35%),
    var(--bg);
  overflow-x:hidden;
}
body:before,body:after{
  content:"";position:fixed;z-index:-1;border-radius:50%;filter:blur(70px);opacity:.28;pointer-events:none
}
body:before{width:240px;height:240px;background:#7c5cff;top:-80px;right:-70px}
body:after{width:220px;height:220px;background:#00d4ff;bottom:-90px;left:-70px}
.box{
  width:min(820px,100%);
  margin:auto;
  padding:30px;
  border:1px solid var(--line);
  border-radius:28px;
  background:linear-gradient(145deg,rgba(19,27,55,.86),rgba(8,13,29,.78));
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  box-shadow:var(--shadow);
}
h1{
  margin:4px 0 8px;
  text-align:center;
  font-size:clamp(30px,7vw,52px);
  font-weight:900;
  letter-spacing:-1px;
  background:linear-gradient(90deg,#fff,#b9b1ff,#79e8ff);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.box:before{
  content:"گەڕانی زیرەک • ناوەکان";
  display:block;text-align:center;color:var(--muted);
  font-size:13px;margin-bottom:25px
}
input,textarea,button{
  width:100%;box-sizing:border-box;
  padding:14px 16px;margin:7px 0;
  border-radius:15px;
  border:1px solid var(--line);
  font:inherit;font-size:16px;
  outline:none;
  transition:.2s ease;
}
input,textarea{
  color:var(--text);
  background:rgba(255,255,255,.055);
}
input::placeholder,textarea::placeholder{color:#8290b1}
input:focus,textarea:focus{
  border-color:rgba(124,92,255,.85);
  box-shadow:0 0 0 4px rgba(124,92,255,.12);
  background:rgba(255,255,255,.075);
}
button{
  border:0;color:white;font-weight:800;
  background:linear-gradient(135deg,var(--accent),#5d7cff);
  cursor:pointer;
  box-shadow:0 10px 28px rgba(124,92,255,.22);
}
button:hover{transform:translateY(-1px);filter:brightness(1.08)}
button:active{transform:translateY(0)}
#searchInput{
  padding:17px 19px;
  border-radius:18px;
  font-size:18px;
  background:rgba(255,255,255,.075);
  border-color:rgba(124,92,255,.32);
}
#results{margin-top:18px}
.person{
  position:relative;
  overflow:hidden;
  margin:12px 0;
  padding:18px;
  border:1px solid var(--line);
  border-radius:19px;
  background:linear-gradient(135deg,rgba(255,255,255,.065),rgba(255,255,255,.025));
  box-shadow:0 12px 30px rgba(0,0,0,.15);
}
.person:before{
  content:"";position:absolute;right:0;top:0;bottom:0;width:3px;
  background:linear-gradient(var(--accent),var(--accent2));
}
.person-name{font-size:20px;font-weight:800;padding-right:5px}
.more-data{margin-top:10px;color:#d9e2ff;white-space:pre-wrap;line-height:1.8}
.no-data{margin-top:10px;color:#7f8aa7}
.empty{
  text-align:center;color:var(--muted);padding:35px 15px;
  border:1px dashed rgba(255,255,255,.12);border-radius:18px;
  background:rgba(255,255,255,.025)
}
.admin{
  margin-top:30px;padding-top:24px;
  border-top:1px solid var(--line)
}
.admin>button{
  background:linear-gradient(135deg,#151d39,#242f57);
  border:1px solid rgba(124,92,255,.3)
}
#adminPanel{
  margin-top:18px;padding:20px;
  border:1px solid var(--line);border-radius:22px;
  background:rgba(0,0,0,.12)
}
#adminPanel h2{
  margin:0 0 14px;font-size:24px
}
#adminPanel h3{
  margin:25px 0 8px;font-size:17px;color:#cbd4ef
}
.delete{
  background:linear-gradient(135deg,#a5163a,var(--danger)) !important;
  box-shadow:0 8px 22px rgba(255,77,109,.16) !important
}
.small{font-size:12px;color:#7f8aa7}
@media(max-width:560px){
  body{padding:12px 10px 35px}
  .box{padding:20px 14px;border-radius:22px}
  h1{font-size:32px}
  #adminPanel{padding:14px}
}
</style>
</head>
<body>
<div class="box">
<h1>گەڕانی ناو</h1>
<input id="searchInput" placeholder="ناو بگەڕێ..." oninput="searchNames()">
<div id="results"><div class="empty">بۆ پیشاندانی ناو، گەڕان بکە.</div></div>
<div class="admin">
<button onclick="openAdmin()">Admin Panel</button>
<div id="adminPanel" style="display:none">
<h2>Admin Panel</h2>
<input id="newName" placeholder="تەواوی داتای کەسەکە">
<textarea id="moreData" rows="5" placeholder="داتای زیاتر"></textarea>
<input id="phoneData" placeholder="ژمارەی تەلەفون">
<button onclick="addPerson()">زیادکردن</button>
<h3>سێرچی ئەدمین</h3><input id="adminSearch" placeholder="ناو یان ژمارەی تەلەفون بگەڕێ..." oninput="adminSearchPeople()"><div id="adminList"></div>
</div></div>
</div>
<script>
const KEY="people";
let people=[];
try{
 const saved=JSON.parse(localStorage.getItem(KEY)||"null");
 if(Array.isArray(saved)) people=saved.map(x=>typeof x==="string"?{name:x,more:""}:{name:String(x.name||""),more:String(x.more||""),phone:String(x.phone||"")}).filter(x=>x.name.trim());
}catch(e){}
if(!people.length){
 people=[
  "ئەوین محمد امین","اسماعیل محمد","ژوان ستار محمد","احمد عولا ابراهیم","احمد عولا احمد",
  "احمد جمیل بریندار","احمد جمیل حسین","اسماعیل رسول","اسماعیل رسول ئەحمەد","حسن علی",
  "حسن علی احمد","حسن علی احمد","حسن علی احمد","حسن علی احمد","حسن علی احمد",
  "حسن علی احمد","حسن علی اسماعیل","حسن علی بابیر","حسن علی تمر","حسن علی جمو"
 ].map(name=>({name,more:"",phone:""}));
 save();
}
function save(){localStorage.setItem(KEY,JSON.stringify(people))}
function searchNames(){
 const q=document.getElementById("searchInput").value.trim().toLowerCase();
 const r=document.getElementById("results");

 if(!q){
   r.innerHTML='<div class="empty">بۆ پیشاندانی ناو، گەڕان بکە.</div>';
   return;
 }

 const words=q.split(/\s+/);

 const found=people.filter(p=>{
   const name=typeof p==="string" ? p : String(p.name||"");
   const nameWords=name.trim().toLowerCase().split(/\s+/);

   // هەر وشەی سێرچ دەبێت لە هەمان شوێنی ناوەکە بێت.
   return words.every((w,i)=>nameWords[i]===w);
 });

 if(!found.length){
   r.innerHTML='<div class="empty">هیچ ناوێک نەدۆزرایەوە.</div>';
   return;
 }

 r.innerHTML="";
 found.forEach(p=>{
   const nameValue=typeof p==="string" ? p : String(p.name||"");
   const moreValue=typeof p==="string" ? "" : String(p.more||"");

   const d=document.createElement("div");
   d.className="person";

   const n=document.createElement("div");
   n.className="person-name";
   n.textContent=nameValue;
   d.appendChild(n);

   const m=document.createElement("div");
   m.className=moreValue.trim()?"more-data":"no-data";
   m.textContent=moreValue.trim()?moreValue:"داتای زیاتر نەدۆزرایەوە";
   d.appendChild(m);

   r.appendChild(d);
 });
}

function openAdmin(){
 if(prompt("کۆدی Admin بنووسە:")!=="5624"){alert("کۆدی Admin هەڵەیە.");return}
 document.getElementById("adminPanel").style.display="block";loadAdmin();
}
function addPerson(){
 const name=document.getElementById("newName").value.trim(),more=document.getElementById("moreData").value.trim(),phone=document.getElementById("phoneData").value.trim();
 if(!name){alert("تکایە ناوی کەسەکە بنووسە.");return}
 people.push({name,more,phone});save();
 document.getElementById("newName").value="";document.getElementById("moreData").value="";document.getElementById("phoneData").value="";
 loadAdmin();searchNames();
}
function adminSearchPeople(){
 const q=document.getElementById("adminSearch").value.trim().toLowerCase();
 const box=document.getElementById("adminList");
 box.innerHTML="";
 if(!q){loadAdmin();return;}
 const found=people.filter(p=>
   p.name.toLowerCase().includes(q) ||
   String(p.phone||"").toLowerCase().includes(q)
 );
 renderAdmin(found);
}
function renderAdmin(list){
 const box=document.getElementById("adminList");
 box.innerHTML="";
 list.forEach(p=>{
  const i=people.indexOf(p);
  const d=document.createElement("div");d.className="person";
  const n=document.createElement("div");n.className="person-name";n.textContent=p.name;d.appendChild(n);
  if(p.phone){
   const ph=document.createElement("div");ph.className="more-data";ph.textContent="ژمارەی تەلەفون: "+p.phone;d.appendChild(ph);
  }
  if(p.more){
   const m=document.createElement("div");m.className="more-data";m.textContent=p.more;d.appendChild(m);
  }
  const b=document.createElement("button");b.className="delete";b.textContent="سڕینەوە";
  b.onclick=()=>{if(confirm("دڵنیایت لە سڕینەوە؟")){people.splice(i,1);save();loadAdmin();searchNames()}};
  d.appendChild(b);box.appendChild(d);
 });
}
function loadAdmin(){
 renderAdmin(people);
}
</script>
</body>
</html>
