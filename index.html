<!DOCTYPE html>
<html lang="ku">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>گەڕانی داتا</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #0d1117;
      color: #fff;
      font-family: Arial, sans-serif;
      direction: rtl;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    h2 {
      text-align: center;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      margin: 7px 0;
      border: 1px solid #30363d;
      border-radius: 8px;
      background: #161b22;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 8px;
      border: none;
      border-radius: 8px;
      background: #238636;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 15px;
      margin-top: 12px;
    }
  </style>
</head>

<body>

<div class="container">

  <h2>گەڕان لە داتا</h2>

  <input id="name" type="text" placeholder="ناو...">

  <input id="year" type="number" placeholder="ساڵ...">

  <button onclick="search()">گەڕان</button>

  <div id="results"></div>

</div>

<script>

const data = [
  {
    name: "ئەوین محمد",
    year: 2007,
    gender: "Female"
  },
  {
    name: "ئەوین محمد",
    year: 1999,
    gender: "Male"
  }
];

function search() {

  const name =
    document.getElementById("name")
      .value
      .trim()
      .toLowerCase();

  const year =
    document.getElementById("year").value;

  const results =
    document.getElementById("results");

  const found = data.filter(item => {

    const nameOK =
      !name ||
      item.name.toLowerCase().includes(name);

    const yearOK =
      !year ||
      String(item.year) === String(year);

    return nameOK && yearOK;
  });

  if (!found.length) {
    results.innerHTML =
      "<div class='card'>هیچ ئەنجامێک نەدۆزرایەوە.</div>";
    return;
  }

  results.innerHTML = found.map(item => `
    <div class="card">
      <b>ناو:</b> ${item.name}<br>
      <b>ساڵ:</b> ${item.year}<br>
      <b>ڕەگەز:</b> ${item.gender}
    </div>
  `).join("");
}

</script>

</body>
</html>
