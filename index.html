<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>سیستەمی گەڕانی ناو</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    color: #111827;
}

.container {
    max-width: 900px;
    margin: 30px auto;
    padding: 15px;
}

.card {
    background: white;
    padding: 20px;
    margin-bottom: 20px;
    border-radius: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,.08);
}

h1, h2 {
    margin-top: 0;
}

input,
button {
    width: 100%;
    padding: 13px;
    margin: 7px 0;
    border-radius: 8px;
    border: 1px solid #d1d5db;
    font-size: 16px;
}

button {
    border: none;
    background: #2563eb;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #1d4ed8;
}

.admin-button {
    background: #111827;
}

.admin-button:hover {
    background: #000;
}

.delete {
    background: #dc2626;
}

.delete:hover {
    background: #b91c1c;
}

.edit {
    background: #f59e0b;
}

.edit:hover {
    background: #d97706;
}

.logout {
    background: #6b7280;
}

.hidden {
    display: none;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th,
td {
    padding: 12px;
    border-bottom: 1px solid #e5e7eb;
    text-align: center;
}

th {
    background: #f8fafc;
}

.actions {
    display: flex;
    gap: 5px;
}

.actions button {
    margin: 0;
}

.count {
    margin-top: 10px;
    color: #475569;
}

.message {
    padding: 10px;
    border-radius: 8px;
    margin-top: 10px;
    display: none;
}

.success {
    background: #dcfce7;
    color: #166534;
}

.error {
    background: #fee2e2;
    color: #991b1b;
}

@media(max-width:600px) {

    .actions {
        flex-direction: column;
    }

    th,
    td {
        padding: 8px 4px;
        font-size: 13px;
    }

}

</style>
</head>


<body>

<div class="container">


<!-- =========================
     PUBLIC SEARCH
========================= -->

<div id="publicPage">

    <div class="card">

        <h1>🔎 گەڕانی ناو</h1>

        <input
            type="text"
            id="search"
            placeholder="دوو یان سێ وشەی ناو بنووسە..."
            oninput="showResults()"
        >

        <div class="count" id="count"></div>

    </div>


    <div class="card">

        <h2>📋 ئەنجامەکان</h2>

        <div style="overflow-x:auto;">

            <table>

                <thead>

                    <tr>
                        <th>#</th>
                        <th>ناو</th>
                    </tr>

                </thead>

                <tbody id="publicTable"></tbody>

            </table>

        </div>

    </div>


    <!-- تەنها ئەم دوگمەیە Admin ـە -->

    <div class="card">

        <button
            class="admin-button"
            onclick="openAdminLogin()"
        >
            🔐 Admin Panel
        </button>

    </div>

</div>



<!-- =========================
     ADMIN LOGIN
========================= -->

<div id="loginPage" class="card hidden">

    <h1>🔐 چوونەژوورەوەی Admin</h1>

    <input
        type="password"
        id="adminPassword"
        placeholder="کۆدی Admin بنووسە"
    >

    <button onclick="adminLogin()">
        چوونەژوورەوە
    </button>

    <button
        class="logout"
        onclick="closeAdminLogin()"
    >
        گەڕانەوە
    </button>

    <div
        id="loginError"
        class="message error"
    >
        کۆدی Admin هەڵەیە
    </div>

</div>



<!-- =========================
     ADMIN PANEL
========================= -->

<div id="adminPanel" class="hidden">


    <div class="card">

        <h1>👤 Admin Panel</h1>

        <button
            class="logout"
            onclick="logoutAdmin()"
        >
            دەرچوون لە Admin
        </button>

    </div>



    <!-- ADD NAME -->

    <div class="card">

        <h2>➕ زیادکردنی ناو</h2>

        <input
            type="text"
            id="newName"
            placeholder="ناوی دوو یان سێ وشەیی..."
        >

        <button onclick="addPerson()">
            زیادکردنی ناو
        </button>

        <div
            id="addMessage"
            class="message success"
        >
            ناوەکە بە سەرکەوتوویی زیادکرا
        </div>

    </div>



    <!-- ADMIN SEARCH -->

    <div class="card">

        <h2>🔎 گەڕانی ناوەکان</h2>

        <input
            type="text"
            id="adminSearch"
            placeholder="بە ناو بگەڕێ..."
            oninput="showAdminPeople()"
        >

    </div>



    <!-- ADMIN TABLE -->

    <div class="card">

        <h2>📋 بەڕێوەبردنی ناوەکان</h2>

        <div style="overflow-x:auto;">

            <table>

                <thead>

                    <tr>
                        <th>#</th>
                        <th>ناو</th>
                        <th>کردار</th>
                    </tr>

                </thead>

                <tbody id="adminTable"></tbody>

            </table>

        </div>

    </div>

</div>


</div>



<script>


/* =========================
   تەنها ئەدمین پاسۆردی هەیە
========================= */

const ADMIN_PASSWORD = "5624";



/* =========================
   داتا
========================= */

let people =
    JSON.parse(
        localStorage.getItem("peopleData")
    ) || [

        { name: "ئەوین محمد امین" },
        { name: "اسماعیل محمد" },
        { name: "ژوان ستار محمد" },
        { name: "احمد عولا ابراهیم" },
        { name: "احمد عولا احمد" },
        { name: "احمد جمیل بریندار" },
        { name: "احمد جمیل حسین" },
        { name: "اسماعیل رسول" },
        { name: "اسماعیل رسول ئەحمەد" },
        { name: "حسن علی" },
        { name: "حسن علی احمد" },
        { name: "حسن علی احمد" },
        { name: "حسن علی احمد" },
        { name: "حسن علی احمد" },
        { name: "حسن علی احمد" },
        { name: "حسن علی احمد" },
        { name: "حسن علی اسماعیل" },
        { name: "حسن علی بابیر" },
        { name: "حسن علی تمر" },
        { name: "حسن علی جمو" }

    ];



/* =========================
   پاشەکەوتکردن
========================= */

function saveData() {

    localStorage.setItem(
        "peopleData",
        JSON.stringify(people)
    );

}



/* =========================
   گەڕانی گشتی
   هیچ پاسۆردێک نییە
========================= */

function showResults() {

    const search =
        document
        .getElementById("search")
        .value
        .trim()
        .toLowerCase();


    const table =
        document.getElementById("publicTable");


    table.innerHTML = "";


    const words =
        search
        .split(/\s+/)
        .filter(word => word.length > 0);


    const results =
        people.filter(person => {

            const name =
                person.name.toLowerCase();

            return words.every(word =>
                name.includes(word)
            );

        });


    results.forEach((person, index) => {

        const row =
            document.createElement("tr");


        row.innerHTML = `

            <td>
                ${index + 1}
            </td>

            <td>
                ${escapeHTML(person.name)}
            </td>

        `;


        table.appendChild(row);

    });


    document.getElementById("count").textContent =
        "ژمارەی ئەنجامەکان: " + results.length;

}



/* =========================
   کردنەوەی Admin Login
========================= */

function openAdminLogin() {

    document
        .getElementById("publicPage")
        .classList.add("hidden");

    document
        .getElementById("loginPage")
        .classList.remove("hidden");

}



/* =========================
   داخستنی Admin Login
========================= */

function closeAdminLogin() {

    document
        .getElementById("loginPage")
        .classList.add("hidden");

    document
        .getElementById("publicPage")
        .classList.remove("hidden");

}



/* =========================
   چوونەژوورەوەی Admin
========================= */

function adminLogin() {

    const password =
        document
        .getElementById("adminPassword")
        .value;


    if (password === ADMIN_PASSWORD) {

        document
            .getElementById("loginPage")
            .classList.add("hidden");

        document
            .getElementById("adminPanel")
            .classList.remove("hidden");

        document
            .getElementById("adminPassword")
            .value = "";

        showAdminPeople();

    }

    else {

        document
            .getElementById("loginError")
            .style.display = "block";

        setTimeout(() => {

            document
                .getElementById("loginError")
                .style.display = "none";

        }, 2000);

    }

}



/* =========================
   دەرچوون
========================= */

function logoutAdmin() {

    document
        .getElementById("adminPanel")
        .classList.add("hidden");

    document
        .getElementById("publicPage")
        .classList.remove("hidden");

    document
        .getElementById("search")
        .value = "";

    showResults();

}



/* =========================
   زیادکردنی ناو
========================= */

function addPerson() {

    const input =
        document.getElementById("newName");


    const name =
        input.value.trim();


    if (!name) {

        alert("تکایە ناو بنووسە");

        return;

    }


    people.push({
        name: name
    });


    saveData();


    input.value = "";


    document
        .getElementById("addMessage")
        .style.display = "block";


    setTimeout(() => {

        document
            .getElementById("addMessage")
            .style.display = "none";

    }, 2000);


    showAdminPeople();

    showResults();

}



/* =========================
   پیشاندانی Admin
========================= */

function showAdminPeople() {

    const table =
        document.getElementById("adminTable");


    const search =
        document
        .getElementById("adminSearch")
        .value
        .trim()
        .toLowerCase();


    table.innerHTML = "";


    const words =
        search
        .split(/\s+/)
        .filter(word => word.length > 0);


    people.forEach((person, index) => {

        const name =
            person.name.toLowerCase();


        const match =
            words.every(word =>
                name.includes(word)
            );


        if (!match) {
            return;
        }


        const row =
            document.createElement("tr");


        row.innerHTML = `

            <td>
                ${index + 1}
            </td>

            <td>
                ${escapeHTML(person.name)}
            </td>

            <td>

                <div class="actions">

                    <button
                        class="edit"
                        onclick="editPerson(${index})"
                    >
                        دەستکاری
                    </button>

                    <button
                        class="delete"
                        onclick="deletePerson(${index})"
                    >
                        سڕینەوە
                    </button>

                </div>

            </td>

        `;


        table.appendChild(row);

    });

}



/* =========================
   دەستکاری ناو
========================= */

function editPerson(index) {

    const person =
        people[index];


    const newName =
        prompt(
            "ناوی نوێ بنووسە:",
            person.name
        );


    if (newName === null) {
        return;
    }


    const cleanName =
        newName.trim();


    if (!cleanName) {

        alert("ناو نابێت بەتاڵ بێت");

        return;

    }


    people[index] = {
        name: cleanName
    };


    saveData();

    showAdminPeople();

    showResults();

}



/* =========================
   سڕینەوە
========================= */

function deletePerson(index) {

    const person =
        people[index];


    const confirmDelete =
        confirm(
            "دڵنیایت لە سڕینەوەی:\n\n" +
            person.name
        );


    if (!confirmDelete) {
        return;
    }


    people.splice(index, 1);


    saveData();

    showAdminPeople();

    showResults();

}



/* =========================
   پاراستنی HTML
========================= */

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}



/* =========================
   Enter بۆ Admin Login
========================= */

document
    .getElementById("adminPassword")
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {
                adminLogin();
            }

        }
    );



/* =========================
   دەستپێکردن
========================= */

showResults();

</script>

</body>
</html>
