<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دانیشتوانی کوردستان و ئێراق</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;700&display=swap');

:root {
  --primary: #2c3e50;
  --accent: #c0392b;
  --bg: #f4f6f7;
  --card-bg: #ffffff;
  --text: #34495e;
  --border: #e0e0e0;
}

* {
  box-sizing: border-box;
}

body {
  font-family: 'Noto Sans Arabic', sans-serif;
  background: linear-gradient(135deg, #eef2f3 0%, #dfe6e9 100%);
  color: var(--text);
  margin: 0;
  padding: 20px;
  min-height: 100vh;
}

.container {
  max-width: 900px;
  margin: 0 auto;
  background: var(--card-bg);
  border-radius: 16px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.08);
  overflow: hidden;
  border-top: 6px solid var(--accent);
}

header {
  background: var(--primary);
  color: white;
  padding: 25px 20px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 28px;
}

main {
  padding: 25px;
}

.card {
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 20px;
  background: var(--card-bg);
}

.card h2 {
  margin-top: 0;
  color: var(--primary);
}

.info {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 12px;
}

.info-box {
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px;
  background: var(--bg);
}

.info-box strong {
  display: block;
  margin-bottom: 5px;
  color: var(--primary);
}

footer {
  text-align: center;
  padding: 18px;
  background: var(--primary);
  color: white;
  font-size: 14px;
}

@media (max-width: 600px) {
  body {
    padding: 10px;
  }

  header h1 {
    font-size: 22px;
  }

  main {
    padding: 15px;
  }
}
</style>
</head>

<body>

<div class="container">

  <header>
    <h1>دانیشتوانی کوردستان و ئێراق</h1>
  </header>

  <main>
    <div class="card">
      <h2>بەخێربێیت</h2>
      <p>
        ئەم پەڕەیە بۆ نیشاندانی زانیاریی گشتی لەبارەی دانیشتوانی
        کوردستان و ئێراق دروستکراوە.
      </p>
    </div>

    <div class="card">
      <h2>زانیاریی گشتی</h2>

      <div class="info">
        <div class="info-box">
          <strong>ناوچە</strong>
          کوردستان و ئێراق
        </div>

        <div class="info-box">
          <strong>زمان</strong>
          کوردی
        </div>

        <div class="info-box">
          <strong>جۆری زانیاری</strong>
          زانیاریی گشتی
        </div>

        <div class="info-box">
          <strong>دۆخ</strong>
          چالاک
        </div>
      </div>
    </div>
  </main>

  <footer>
    © 2026 دانیشتوانی کوردستان و ئێراق
  </footer>

</div>

</body>
</html>
